<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Redirecting to the author's portfolio.">
  <title>Redirecting — psvineet.me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #faf7ef;
      font-family: 'Noto Sans', system-ui, sans-serif;
      color: #10233f;
    }

    .wrap {
      width: min(620px, 100%);
      text-align: center;
    }

    .tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: #b8954a;
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(24px, 5.5vw, 48px);
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1.1;
      margin-bottom: 8px;
      white-space: nowrap;
    }

    @media (max-width: 560px) {
      h1 { white-space: normal; font-size: clamp(28px, 8vw, 36px); }
    }

    .author {
      font-size: 13px;
      color: #9aa0a8;
      margin-bottom: 18px;
    }

    .author strong {
      color: #b8954a;
      font-weight: 600;
    }

    .message {
      margin: 0 auto 16px;
      font-size: clamp(15px, 2vw, 17px);
      color: #4f5865;
      line-height: 1.65;
    }

    .message .site {
      color: #10233f;
      font-weight: 700;
    }

    .box {
      max-width: 400px;
      margin: 0 auto 26px;
      padding: 18px 20px;
      border: 1px solid rgba(16, 35, 63, .12);
      background: rgba(255, 255, 255, .35);
    }

    .countdown {
      font-size: 14px;
      color: #4f5865;
    }

    #seconds { color: #b8954a; }

    .progress {
      height: 2px;
      margin-top: 14px;
      background: rgba(16, 35, 63, .1);
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: #b8954a;
      transform-origin: left;
      animation: drain 5s linear forwards;
    }

    @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 46px;
      padding: 0 24px;
      background: #10233f;
      color: #fff;
      font-family: 'Noto Sans', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid #10233f;
      transition: .2s ease;
    }

    .btn:hover {
      background: transparent;
      color: #10233f;
      border-color: #b8954a;
    }

    .note {
      margin-top: 16px;
      font-size: 12px;
      color: #9aa0a8;
      line-height: 1.5;
    }

    .note strong { color: #10233f; }

    @media (max-width: 400px) { .btn { width: 100%; } }

    @media (prefers-reduced-motion: reduce) {
      .progress-bar { animation: none; transform: scaleX(0); }
      .btn { transition: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="tag">Blog moved</p>
    <h1>You are being redirected</h1>
    <p class="author">A blog by <strong>Vineet Pratap Singh</strong></p>
    <p class="message">
      This blog is now part of the author's portfolio.
      You will be taken to <span class="site">psvineet.me</span>.
    </p>
    <div class="box">
      <div class="countdown">Redirecting in <span id="seconds">5</span> seconds</div>
      <div class="progress">
        <div class="progress-bar"></div>
      </div>
    </div>
    <div id="fallback" style="display:none">
      <a class="btn" href="https://psvineet.me">Go to Portfolio</a>
      <p class="note">Open the <strong>Blog</strong> section there to read the articles.</p>
    </div>
  </main>
  <script>
    const el = document.getElementById('seconds');
    let n = 5;
    const t = setInterval(() => {
      el.textContent = --n;
      if (n <= 0) {
        clearInterval(t);
        try {
          window.location.href = 'https://psvineet.me';
          setTimeout(() => {
            document.getElementById('fallback').style.display = 'block';
          }, 1500);
        } catch(e) {
          document.getElementById('fallback').style.display = 'block';
        }
      }
    }, 1000);
  </script>
</body>
</html>

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<meta name="description" content="Redirecting to the author's portfolio.">

<title>Redirecting — psvineet.me</title>

<style>
    :root {
        --cream: #faf7ef;
        --navy: #10233f;
        --gold: #b8954a;
        --text: #4f5865;
        --border: rgba(16, 35, 63, 0.12);
    }

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        min-height: 100%;
    }

    body {
        min-height: 100vh;
        min-height: 100dvh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 24px;

        background: var(--cream);
        color: var(--navy);

        /* Universal system font */
        font-family:
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Helvetica,
            Arial,
            sans-serif;
    }

    .container {
        width: 100%;
        max-width: 620px;
        text-align: center;
    }

    .line {
        width: 48px;
        height: 3px;
        margin: 0 auto 30px;
        background: var(--gold);
    }

    .label {
        margin-bottom: 14px;

        color: var(--gold);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    h1 {
        margin: 0;

        color: var(--navy);
        font-size: clamp(32px, 7vw, 52px);
        line-height: 1.1;
        font-weight: 650;
        letter-spacing: -1.5px;
    }

    .message {
        max-width: 520px;
        margin: 20px auto 0;

        color: var(--text);
        font-size: clamp(15px, 2vw, 17px);
        line-height: 1.6;
    }

    .site {
        color: var(--navy);
        font-weight: 700;
    }

    .redirect-box {
        max-width: 420px;
        margin: 30px auto 0;
        padding: 18px;

        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.35);
    }

    .countdown {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;

        color: var(--text);
        font-size: 14px;
    }

    #seconds {
        min-width: 22px;

        color: var(--gold);
        font-size: 18px;
        font-weight: 700;
    }

    .progress {
        width: 100%;
        height: 2px;
        margin-top: 14px;

        overflow: hidden;
        background: rgba(16, 35, 63, 0.1);
    }

    .progress-bar {
        width: 100%;
        height: 100%;

        background: var(--gold);

        transform-origin: left;
        animation: countdown 5s linear forwards;
    }

    @keyframes countdown {
        from {
            transform: scaleX(1);
        }

        to {
            transform: scaleX(0);
        }
    }

    .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        min-height: 46px;
        margin-top: 24px;
        padding: 0 22px;

        border: 1px solid var(--navy);
        background: var(--navy);
        color: #ffffff;

        font-size: 14px;
        font-weight: 600;
        text-decoration: none;

        transition: 0.2s ease;
    }

    .button:hover {
        background: transparent;
        color: var(--navy);
        border-color: var(--gold);
    }

    .note {
        margin-top: 16px;

        color: #7a818b;
        font-size: 12px;
        line-height: 1.5;
    }

    .note strong {
        color: var(--navy);
    }

    @media (max-width: 480px) {
        body {
            padding: 20px;
        }

        .line {
            margin-bottom: 24px;
        }

        h1 {
            font-size: 34px;
            letter-spacing: -1px;
        }

        .message {
            margin-top: 16px;
            font-size: 14px;
        }

        .redirect-box {
            margin-top: 24px;
            padding: 16px;
        }

        .button {
            width: 100%;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .progress-bar {
            animation: none;
        }

        .button {
            transition: none;
        }
    }
</style>


</head>

<body>

<main class="container">

    <div class="line"></div>

    <div class="label">Blog moved</div>

    <h1>You are being redirected</h1>

    <p class="message">
        This blog is now part of the author's portfolio.
        You will be taken to
        <span class="site">psvineet.me</span>.
    </p>

    <div class="redirect-box">

        <div class="countdown">
            Redirecting in
            <span id="seconds">5</span>
            seconds
        </div>

        <div class="progress">
            <div class="progress-bar"></div>
        </div>

    </div>

    <a class="button" href="https://psvineet.me">
        Go to Portfolio
    </a>

    <p class="note">
        Open the <strong>Blog</strong> section there to read the articles.
    </p>

</main>

<script>
    const redirectURL = "https://psvineet.me";
    const secondsElement = document.getElementById("seconds");

    let seconds = 5;

    const countdown = setInterval(() => {
        seconds--;
        secondsElement.textContent = seconds;

        if (seconds <= 0) {
            clearInterval(countdown);
            window.location.href = redirectURL;
        }
    }, 1000);
</script>

</body>
</html>
